# Copy the [github] section into the app's Secrets on Streamlit Community Cloud
# (App settings -> Secrets) so saved line-ups are committed to the repo and survive restarts.
# Without it, line-ups are saved to ./lineups on the server, which Streamlit Cloud wipes on restart.
#
# token: a fine-grained GitHub token with "Contents: Read and write" on this repository only.

[github]
token = "github_pat_xxx"
repo = "your-user/lineup-planner"
branch = "main"
folder = "lineups"
